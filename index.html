<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Love You Mam</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #020306; }
    body { overflow: hidden; display: grid; place-items: center; font-family: Georgia, serif; }
    .stage { position: relative; width: min(100vw, 576px); height: min(100vh, 1024px); }
    canvas { display: block; width: 100%; height: 100%; background: #020306; }
    .love-title {
      position: absolute; left: 50%; top: 330px; transform: translateX(-50%);
      margin: 0; width: 100%; text-align: center; pointer-events: none;
      font: 800 3rem/1.1 Arial, sans-serif;
      background: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #f97316 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      opacity: 0; transition: opacity .15s linear;
      filter: drop-shadow(0 0 14px rgba(236,72,153,.55));
    }
    .controls { position: fixed; bottom: 14px; display: flex; gap: 10px; align-items: center; }
    button { border: 1px solid #6974a8; border-radius: 999px; padding: 8px 15px; color: #fff; background: #171d3b; cursor: pointer; }
    .hint { color: #9ba5c7; font: 12px Arial, sans-serif; opacity: .8; }
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="canvas" aria-label="A glowing heart made from Love You Mam words"></canvas>
    <h1 id="loveTitle" class="love-title">I love you</h1>
  </div>
  <div class="controls">
    <button id="musicButton" type="button">▶ Play music</button>
    <span class="hint">Esc pauses the animation</span>
  </div>

  <script>
    'use strict';
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const title = document.getElementById('loveTitle');
    const musicButton = document.getElementById('musicButton');
    const W = 576, H = 1024, cx = W / 2, cy = 360, scale = 13.5;
    const words = ['Love You Mam', 'LOVE YOU MAM', 'love you mam', 'Love you mam'];
    const colors = ['#196ee6', '#0a82dc', '#2d5fe1', '#468ceb', '#1455c8'];
    const totalFrames = 1140, fadeStart = 1010;
    let particles = [], frame = 0, paused = false;
    const spriteCache = new Map();

    function heart(t) {
      return [16 * Math.sin(t) ** 3,
        -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t))];
    }
    function inside(x, y, polygon) {
      let hit = false;
      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        const a = polygon[i], b = polygon[j];
        if ((a[1] > y) !== (b[1] > y) && x < (b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]) hit = !hit;
      }
      return hit;
    }
    function makeParticles() {
      const out = [], polygon = [];
      for (let i = 0; i < 180; i++) polygon.push(heart(i / 180 * Math.PI * 2));
      const add = (x, y, delay) => out.push({
        word: words[Math.random()*words.length|0], color: colors[Math.random()*colors.length|0],
        x: cx + x * scale + (Math.random()*8-4), y: cy + y * scale + (Math.random()*8-4), delay,
        size: .7 + Math.random()*.8, phase: Math.random()*Math.PI*2,
        flicker: Math.random()*Math.PI*2, alpha: 0
      });
      for (let i = 0; i < 150; i++) {
        const p = heart(i / 150 * Math.PI * 2 + (Math.random()-.5)*.01);
        add(p[0] * (.95 + Math.random()*.05), p[1] * (.95 + Math.random()*.05), 20 + i/150*170 + Math.random()*10);
      }
      let count = 0;
      while (count++ < 190) {
        const x = Math.random()*32-16, y = Math.random()*30-13;
        if (inside(x, y, polygon)) add(x, y, 180 + Math.random()*600);
      }
      return out;
    }
    // Cache each text drawing once. fillText on every particle, every frame was the main slowdown.
    function spriteFor(p) {
      const size = Math.max(9, 12*p.size) | 0;
      const key = `${p.word}|${p.color}|${size}`;
      if (spriteCache.has(key)) return spriteCache.get(key);
      const off = document.createElement('canvas'), o = off.getContext('2d');
      o.font = `bold ${size}px Arial`;
      const width = Math.ceil(o.measureText(p.word).width) + 4;
      off.width = width; off.height = size + 5;
      o.font = `bold ${size}px Arial`; o.textBaseline = 'top'; o.fillStyle = p.color;
      o.fillText(p.word, 2, 0);
      spriteCache.set(key, off);
      return off;
    }
    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = W*dpr; canvas.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    function draw() {
      if (!paused) frame++;
      if (frame > totalFrames + 60) { particles = makeParticles(); frame = 0; }
      const gradient = ctx.createLinearGradient(0,0,0,H);
      gradient.addColorStop(0, '#020306'); gradient.addColorStop(.42, '#080c1b'); gradient.addColorStop(1, '#020306');
      ctx.fillStyle = gradient; ctx.fillRect(0,0,W,H);

      // A single inexpensive pass keeps the animation smooth on mobile devices.
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (const p of particles) {
        if (frame > p.delay) p.alpha = Math.min(1, p.alpha + .055);
        const fade = frame > fadeStart ? Math.max(0, 1-(frame-fadeStart)/(totalFrames-fadeStart)) : 1;
        const flicker = p.alpha >= 1 ? .75 + .25*Math.sin(frame*.04+p.flicker) : 1;
        const a = p.alpha * flicker * fade;
        if (a <= 0) continue;
        const sprite = spriteFor(p);
        ctx.globalAlpha = a;
        ctx.drawImage(sprite, p.x + Math.sin(frame*.02+p.phase)*2 - sprite.width/2,
          p.y + Math.cos(frame*.017+p.phase)*2 - sprite.height/2);
      }
      ctx.restore();

      const strength = Math.max(0, Math.min(1, (frame-800)/110)) *
        (frame > fadeStart ? Math.max(0, 1-(frame-fadeStart)/(totalFrames-fadeStart)) : 1);
      title.style.opacity = strength;
      requestAnimationFrame(draw);
    }

    // Browsers require a user gesture before audio can start. This creates a small,
    // royalty-free ambient melody without requiring a large audio file in the repo.
    let audioContext, musicTimer, note = 0;
    function toggleMusic() {
      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      if (musicTimer) { clearInterval(musicTimer); musicTimer = null; musicButton.textContent = '▶ Play music'; return; }
      const notes = [261.63, 329.63, 392.00, 329.63, 293.66, 349.23, 440.00, 349.23];
      const playNote = () => {
        const osc = audioContext.createOscillator(), gain = audioContext.createGain();
        osc.type = 'sine'; osc.frequency.value = notes[note++ % notes.length];
        gain.gain.setValueAtTime(.0001, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(.045, audioContext.currentTime + .03);
        gain.gain.exponentialRampToValueAtTime(.0001, audioContext.currentTime + .75);
        osc.connect(gain).connect(audioContext.destination); osc.start(); osc.stop(audioContext.currentTime + .8);
      };
      playNote(); musicTimer = setInterval(playNote, 800); musicButton.textContent = '■ Stop music';
    }
    addEventListener('resize', resize);
    addEventListener('keydown', e => { if (e.key === 'Escape') paused = !paused; });
    musicButton.addEventListener('click', toggleMusic);
    resize(); particles = makeParticles(); draw();
  </script>
</body>
</html>
